server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /opt/clang-tidy-configurator/front-end/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /analyze {
        proxy_pass http://127.0.0.1:8080/analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location /fix {
        proxy_pass http://127.0.0.1:8080/fix;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    # Exact match: as a prefix match this would also swallow the static
    # /format-config.json and proxy it to the backend (which 404s it).
    location = /format {
        proxy_pass http://127.0.0.1:8080/format;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }
}
